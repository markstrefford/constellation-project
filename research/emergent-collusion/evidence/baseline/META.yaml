# Evidence-folder metadata. `status` drives the publish workflow (see repo CLAUDE.md).
# raw-r2/ is gitignored (bulk event logs); baseline-final-wealth.json is committable.
status: draft
title: "No-cartel baseline - the Tier-D reference"
epic: e14-s06
date: 2026-07-22
kind: baseline event logs + per-planet wealth
scenario: "same world as cartel-run (stellar_neighborhood_interdependent + scenario_interdependent), 1000 ticks, NO cartel policies, NO governors"
prompt: none (no LLM - pure-market deterministic sim)
seeds: [42, 7, 99, 123, 2024, 100, 101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114]
parity: "verified - T0 planet state identical to the arena cartel runs, seed-matched, all 68 planets to the cent"
runner: "lab/tools/run_baseline.py (in the sim repo); config lab/configs/cartel-run-baseline.yaml"
summary: >
  The seed-matched no-cartel reference for e14-s06 Tier D. Same world and seeds as
  the cartel runs, with the relay_suppression + destination_embargo policies and
  the cartel governors removed - so the per-planet wealth delta (cartel run minus
  this baseline, same seed) is the cartel's actual economic footprint, isolated.
  Ran locally (no Modal, no LLM), deterministic, parity-verified against the arena
  runs' T0 state.
contents:
  - raw-r2/: baseline-s<seed>.events.json.gz (20 runs) [gitignored]
  - baseline-final-wealth.json: final per-planet wealth for all 20 seeds
