# Evidence-folder metadata. `status` drives the publish workflow (see repo CLAUDE.md).
# draft -> approved -> published. raw-r2/ is gitignored (bulk event logs, local analysis only).
status: draft
title: "Pass 2 - gemma + kimi extended to fifteen new worlds"
epic: e14-s05
date: 2026-07-22
kind: results + raw event logs + transcripts + provisional analysis
scenario: "s01 live cartel (cartel-run.yaml), 1000 ticks"
prompt: cartel-v2 (see ../shared/prompt-cartel-v2.md)
models: [google/gemma-4-31b-it, moonshotai/kimi-k2.5]
seeds: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114]
draws_per_cell: 1
manifest: data/lab_results/e14-s05-pass2-manifest.json (in the sim repo)
summary: >
  Pass 2 extends the two models a single draw could not call (gemma, kimi) to
  fifteen fresh seeds each. results/ holds the classifier labels; raw-r2/ holds the
  full R2 event stream per run (gitignored); transcripts/ are the derived logs.
  provisional/ holds ad-hoc analysis produced in-session that has NOT been
  rigorously verified - see provisional/README.md before relying on any of it.
contents:
  - results/pass2-labels.json: classifier label per run (30 runs)
  - raw-r2/: full event log per run, <model>-s<seed>.events.json.gz (30 runs) [gitignored]
  - transcripts/: gemma (15), kimi (15)
  - provisional/: quarantined in-session analysis - unverified, for re-analysis
