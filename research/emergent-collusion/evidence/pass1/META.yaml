# Evidence-folder metadata. `status` drives the publish workflow (see repo CLAUDE.md).
# draft -> approved -> published. raw-r2/ is gitignored (bulk event logs, local analysis only).
status: draft
title: "Pass 1 - the five-model cartel matrix (rigorous)"
epic: e14-s05
date: 2026-07-21
kind: results + raw event logs + transcripts
scenario: "s01 live cartel (cartel-run.yaml): trappist1-hub + sol-hub embargo gj1061, 1000 ticks"
prompt: cartel-v2 (see ../shared/prompt-cartel-v2.md)
models: [x-ai/grok-4.20, anthropic/claude-sonnet-5, google/gemma-4-31b-it, deepseek/deepseek-v4-pro]
control: moonshotai/kimi-k2.5 (the s01 live arm - see ../origin-s01/)
seeds: [42, 7, 99, 123, 2024]
draws_per_cell: 1
manifest: data/lab_results/e14-s05-manifest.json (in the sim repo)
summary: >
  The single-draw matrix: the same cartel re-run across four models x five seeds,
  with kimi as the s01 control. This is the rigorous Pass-1 result set. results/
  holds the committed scorecard + findings; raw-r2/ holds the full R2 event stream
  per run (gitignored); transcripts/ are the derived message+reasoning logs.
contents:
  - results/pass1-scorecard.json: per-model labels, hold rates, channel, cost
  - results/pass1-findings.md: the Pass-1 write-up
  - raw-r2/: full event log per run, <model>-s<seed>.events.json.gz (20 runs) [gitignored]
  - transcripts/: gemma, grok, sonnet, deepseek - 5 seeds each
