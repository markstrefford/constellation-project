summary: >
  Rigorous per-run analysis over all 50 raw R2 logs, answering "did the cartel
  bite?". Finding: the embargo held in every run, but gj1061 was harmed in none -
  it paid ~1.3 for food (base 3.0), gained wealth, never starved, whether the
  cartel held or defected. The premium lever is anchored to the hubs' cheap price,
  not the victim's willingness-to-pay, so collusion does not pay in this world's
  current calibration. This is the fleet-wide, honest replacement for the
  quarantined single-run economic read.
contents:
